
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Управления Витриной</title>
    <!-- Подключаем бесплатную мгновенную базу данных реального времени -->
    <script src="https://jsdelivr.net"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #070810; font-family: -apple-system, sans-serif; color: #fff; padding: 20px; display: flex; justify-content: center; }
        .panel-box { width: 100%; max-width: 400px; background: #1a1c2e; border: 2px solid #e74c3c; border-radius: 20px; padding: 20px; display: none; flex-direction: column; gap: 15px; box-shadow: 0 0 25px rgba(231,76,60,0.2); }
        .panel-box.active { display: flex; }
        h2 { font-size: 16px; color: #e74c3c; text-transform: uppercase; text-align: center; border-bottom: 1px dashed rgba(231,76,60,0.3); padding-bottom: 10px; }
        .field { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 11px; color: #c5c6c7; text-transform: uppercase; font-weight: bold; }
        textarea, input { background: #0b0c10; border: 1px solid #2c3147; padding: 10px; border-radius: 8px; color: #fff; font-size: 12px; outline: none; font-family: monospace; }
        textarea { height: 60px; resize: none; }
        textarea:focus, input:focus { border-color: #e74c3c; }
        .btn { width: 100%; height: 42px; border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; }
        .btn-save { background: #2ecc71; }
        .btn-clear { background: #e74c3c; }
    </style>
</head>
<body>

    <div class="panel-box" id="adminUI">
        <h2>Управление рекламной платформой</h2>
        
        <div class="field">
            <label>Текст VIP блока (или ссылка на фото баннера):</label>
            <input type="text" id="admVipText" placeholder="Введите рекламный текст или ссылку на фото...">
        </div>
        <div class="field">
            <label>Ссылка для кнопки VIP блока (Переход в ВК):</label>
            <input type="text" id="admVipUrl" placeholder="https://vk.ru...">
        </div>
        <div class="field">
            <label>Код Верхнего Рекламного Блока (468x60):</label>
            <textarea id="admCodeTop" placeholder="Вставьте HTML/JS код баннера..."></textarea>
        </div>
        <div class="field">
            <label>Код Среднего Рекламного Блока (300x250):</label>
            <textarea id="admCodeMid" placeholder="Вставьте HTML/JS код баннера..."></textarea>
        </div>
        <div class="field">
            <label>Код Текстовых Ссылок:</label>
            <textarea id="admCodeLinks" placeholder="Вставьте HTML/JS код текстовых ссылок..."></textarea>
        </div>
        
        <button class="btn btn-save" onclick="saveDataToCloud()">Сохранить настройки витрины</button>
        <button class="btn btn-clear" onclick="clearGlobalChat()">Очистить рекламный чат</button>
    </div>

<script>
    // Защита: Спрашиваем пароль ПЕРЕД отображением страницы
    const pass = prompt("Введите секретный пароль администратора:");
    if (pass === "1234") {
        document.getElementById('adminUI').classList.add('active');
    } else {
        alert("Доступ заблокирован.");
        window.location.href = "index.html"; // Выкидываем взломщика на главный сайт
    }

    // Подключаемся к облачной базе реального времени (Используем имя вашего репозитория для уникальности канала)
    const db = Gun(['https://herokuapp.com']).get('matrix_traffic_zone_v1');

    // Получаем текущие настройки из облака при загрузке
    db.get('config').on(data => {
        if(data) {
            document.getElementById('admVipText').value = data.vip_text || '';
            document.getElementById('admVipUrl').value = data.vip_url || '';
            document.getElementById('admCodeTop').value = data.code_top || '';
            document.getElementById('admCodeMid').value = data.code_mid || '';
            document.getElementById('admCodeLinks').value = data.code_links || '';
        }
    });

    // Сохраняем в облако — изменения мгновенно улетят на index.html абсолютно всем пользователям!
    function saveDataToCloud() {
        db.get('config').put({
            vip_text: document.getElementById('admVipText').value,
            vip_url: document.getElementById('admVipUrl').value,
            code_top: document.getElementById('admCodeTop').value,
            code_mid: document.getElementById('admCodeMid').value,
            code_links: document.getElementById('admCodeLinks').value
        });
        alert("Настройки успешно отправлены в облако витрины!");
    }

    function clearGlobalChat() {
        db.get('chat').put(null);
        db.get('chat_trigger').put({ clear_time: Date.now() });
        alert("Команда на очистку чата отправлена!");
    }
</script>
</body>
</html>
