<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Premium Traffic Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: radial-gradient(circle at top, #141526 0%, #070810 100%); 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            padding: 15px; 
            gap: 15px; 
            overflow-x: hidden; 
        }
        
        .portal-shell { 
            width: 100%; 
            max-width: 400px; 
            background: rgba(31, 40, 51, 0.65); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(69, 243, 255, 0.25); 
            border-radius: 28px; 
            display: flex; 
            flex-direction: column; 
            padding: 20px; 
            gap: 18px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px rgba(102,252,241,0.05); 
        }
        
        .portal-header { text-align: center; cursor: pointer; user-select: none; }
        .portal-header h1 { font-size: 24px; color: #66fcf1; text-shadow: 0 0 15px #66fcf1; font-weight: 900; }
        .portal-header p { font-size: 10px; color: #94a1c2; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px; }
        
        /* VIP БЛОК АДМИНИСТРАТОРА */
        .vip-admin-block { 
            width: 100%; 
            background: linear-gradient(135deg, #16192e 0%, #0b0c16 100%); 
            border: 2px solid #ffb167; 
            border-radius: 18px; 
            padding: 14px; 
            text-align: center; 
            position: relative; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            align-items: center; 
            box-shadow: 0 0 20px rgba(255,177,103,0.25); 
        }

        .vip-badge { 
            position: absolute; 
            top: 0; 
            left: 0; 
            background: #ffb167; 
            color: #0b0c10; 
            font-size: 9px; 
            font-weight: bold; 
            padding: 3px 10px; 
            border-bottom-right-radius: 12px; /* Исправлено */
        }

        .admin-status {
            font-size: 14px;
            color: #ffb167;
            font-weight: 600;
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: #ffb167;
            color: #0b0c10;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .traffic-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card span {
            display: block;
            font-size: 12px;
            color: #94a1c2;
        }

        .stat-card strong {
            font-size: 16px;
            color: #66fcf1;
        }
    </style>
</head>
<body>

    <div class="portal-shell">
        <header class="portal-header">
            <h1>MATRIX</h1>
            <p>Premium Traffic Management</p>
        </header>

        <!-- VIP ADMIN SECTION -->
        <div class="vip-admin-block">
            <div class="vip-badge">ADMIN ACCESS</div>
            <div class="admin-status">CONTROL PANEL ACTIVE</div>
            
            <div class="traffic-stats">
                <div class="stat-card">
                    <span>Traffic</span>
                    <strong>1.2k/s</strong>
                </div>
                <div class="stat-card">
                    <span>Nodes</span>
                    <strong>42/42</strong>
                </div>
            </div>

            <button class="action-btn">MANAGE TRAFFIC</button>
        </div>

        <!-- MAIN CONTENT AREA -->
        <div style="text-align: center; color: #94a1c2; font-size: 13px;">
            <p>All systems operational. Monitoring real-time data flow.</p>
        </div>
    </div>

</body>
</html>
