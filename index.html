<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Premium Traffic Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: radial-gradient(circle at top, #141526 0%, #070810 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; gap: 15px; overflow-x: hidden; }
        
        .portal-shell { 
            width: 100%; 
            max-width: 400px; 
            background: rgba(31, 40, 51, 0.65); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(69, 243, 255, 0.25); 
            border-radius: 28px; 
            display: flex; 
            flex-direction: column; 
            padding: 20px; 
            gap: 18px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px rgba(102,252,241,0.05); 
        }
        
        .portal-header { text-align: center; }
        .portal-header h1 { font-size: 24px; color: #66fcf1; text-shadow: 0 0 15px #66fcf1; font-weight: 900; }
        .portal-header p { font-size: 10px; color: #94a1c2; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px; }
        
        /* VIP БЛОК АДМИНИСТРАТОРА */
        .vip-admin-block { width: 100%; background: linear-gradient(135deg, #16192e 0%, #0b0c16 100%); border: 2px solid #ffb167; border-radius: 18px; padding: 14px; text-align: center; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 12px; align-items: center; box-shadow: 0 0 20px rgba(255,177,103,0.25); }
        .vip-badge { position: absolute; top: 0; left: 0; background: #ffb167; color: #0b0c10; font-size: 9px; font-weight: bold; padding: 3px 10px; border-bottom-right-radius: 10px; }
        .vip-title { font-size: 13px; font-weight: 600; color: #fff; margin-top: 8px; line-height: 1.4; }
        
        /* Кнопка с прямой железной ссылкой на ваш профиль */
        .vk-btn { 
            width: 95%; 
            height: 38px; 
            background: linear-gradient(90deg, #0066ff 0%, #00bfff 100%); 
            border: none; 
            border-radius: 10px; 
            color: #fff; 
            font-size: 12px; 
            font-weight: bold; 
            cursor: pointer; 
            text-transform: uppercase; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            text-decoration: none; 
            box-shadow: 0 4px 15px rgba(0,102,255,0.4); 
        }
        
        .banner-wrapper { width: 100%; display: flex; justify-content: center; align-items: center; text-align: center; overflow: hidden; }
        .links-wrapper { width: 100%; background: rgba(7, 8, 16, 0.6); border: 1px solid rgba(69, 243, 255, 0.2); border-radius: 16px; padding: 14px; font-size: 13px; color: #c5c6c7; display: flex; flex-direction: column; gap: 8px; }
        .links-title { font-size: 10px; color: #45f3ff; font-weight: bold; letter-spacing: 1px; border-bottom: 1px solid rgba(102,252,241,0.15); padding-bottom: 5px; text-transform: uppercase; }
        
        /* РЕКЛАМНЫЙ ЧАТ */
        .chat-container { width: 100%; background: rgba(7, 8, 16, 0.7); border: 1px solid rgba(69, 243, 255, 0.25); border-radius: 20px; display: flex; flex-direction: column; height: 310px; overflow: hidden; }
        .chat-header { background: linear-gradient(90deg, rgba(102,252,241,0.15) 0%, rgba(219,123,242,0.05) 100%); padding: 10px 14px; font-size: 11px; font-weight: bold; color: #66fcf1; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(102,252,241,0.15); }
        .chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg-item { background: rgba(31, 40, 51, 0.5); padding: 10px 12px; border-radius: 12px; border-left: 3px solid #db7bf2; word-break: break-all; }
        .msg-meta { font-size: 10px; color: #45f3ff; font-weight: bold; margin-bottom: 3px; display: flex; justify-content: space-between; }
        
        .chat-messages a { color: #45f3ff; text-decoration: underline; font-weight: bold; cursor: pointer; }
        
        .chat-inputs { display: flex; flex-direction: column; gap: 8px; padding: 12px; background: #1f2833; border-top: 1px solid rgba(102,252,241,0.15); }
        .chat-in { background: #0b0c10; border: 1px solid rgba(69, 243, 255, 0.2); padding: 10px; border-radius: 10px; color: #fff; font-size: 13px; outline: none; }
        .btn-send { background: linear-gradient(90deg, #66fcf1 0%, #db7bf2 100%); border: none; color: #0b0c10; font-weight: bold; border-radius: 10px; font-size: 11px; cursor: pointer; text-transform: uppercase; }
        
        .header-partner-block { width: 100%; max-width: 400px; display: flex; justify-content: center; align-items: center; text-align: center; }
        .footer-partner-block { width: 100%; max-width: 400px; display: flex; justify-content: center; align-items: center; text-align: center; }
    </style>
</head>
<body>

    <div class="header-partner-block" id="zoneTop"></div>

    <div class="portal-shell">
        <div class="portal-header">
            <h1>MATRIX TRAFFIC</h1>
            <p>Автоматическая рекламная платформа</p>
        </div>

        <!-- VIP БЛОК АДМИНИСТРАТОРА -->
        <div class="vip-admin-block">
            <div class="vip-badge">👑 VIP СЛОТ</div>
            <div class="vip-title">Связь с админом по поводу рекламы! Купить этот блок напрямую через ВК</div>
            <!-- Прямая неуязвимая ссылка на ваш точный профиль -->
            <a href="https://vk.ru/idkirik99" target="_blank" class="vk-btn">Написать админу в ВК</a>
        </div>

        <!-- РЕКЛАМНЫЙ ЧАТ -->
        <div class="chat-container">
            <div class="chat-header">
                <span>💬 РЕКЛАМНЫЙ СТРИМ ОНЛАЙН</span>
                <span style="color: #ffb167; font-size: 9px; font-weight: 800;">БЕЗ МОДЕРАЦИИ</span>
            </div>
            <div class="chat-messages" id="chatBox"></div>
            <div class="chat-inputs">
                <input type="text" id="chatMsg" class="chat-in" placeholder="Текст вашего объявления или ссылка...">
                <button class="btn-send" style="height: 36px;" onclick="sendChatMessage()">Опубликовать бесплатно</button>
            </div>
        </div>

        <div class="banner-wrapper" id="zoneMid"></div>

        <div class="links-wrapper" id="zoneLinks">
            <div class="links-title">🔗 РЕКОМЕНДУЕМЫЕ ССЫЛКИ ПАРТНЕРОВ:</div>
            <div id="linkslotContainer">Здесь будут отображаться контекстные ссылки...</div>
        </div>
    </div>

    <div class="footer-partner-block" id="slotBottomLinks"></div>

<script>
    const randomUserId = Math.floor(Math.random() * 899) + 100;
    const currentNick = "Гость #" + randomUserId;

    function linkifyText(text) {
        const urlPattern = /(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|]|\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,4}\b|\b(?:[A-Z0-9-]+\.)+(?:com|ru|net|org|biz|info|cc|me|tv|io|co|bot|xyz|shop|online|site|club|link)(w*)\/?(?:[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])?)/gi;
        return text.replace(urlPattern, function(url) {
            let href = url;
            if (!/^https?:\/\//i.test(url)) href = 'https://' + url;
            return `<a href="${href}" target="_blank">${url}</a>`;
        });
    }

    function renderChatMessages() {
        const box = document.getElementById('chatBox');
        if(!box) return;
        const msgs = JSON.parse(localStorage.getItem('matrix_pure_local_chat') || '[]');
        
        if (msgs.length === 0) {
            box.innerHTML = `<div class="msg-item" id="sys-welcome"><div class="msg-meta"><span>Система</span></div>Добро пожаловать! Здесь вы можете бесплатно оставить ссылку на свой проект. Спам разрешен!</div>`;
            return;
        }
        box.innerHTML = '';
        msgs.forEach(m => {
            const cleanText = linkifyText(m.text);
            box.innerHTML += `<div class="msg-item"><div class="msg-meta"><span>${m.name}</span> <span>${m.time || ''}</span></div>${cleanText}</div>`;
        });
        box.scrollTop = box.scrollHeight;
    }

    function sendChatMessage() {
        const textInput = document.getElementById('chatMsg');
        const text = textInput.value.trim();
        if(!text) return alert("Введите текст рекламы!");
        
        const box = document.getElementById('chatBox');
        let now = new Date();
        const timeStr = (now.getHours()<10?'0':'')+now.getHours()+':'+(now.getMinutes()<10?'0':'')+now.getMinutes();

        let msgs = JSON.parse(localStorage.getItem('matrix_pure_local_chat') || '[]');
        msgs.push({ name: currentNick, text: text, time: timeStr });
        
        if(msgs.length > 40) msgs.shift();
        
        localStorage.setItem('matrix_pure_local_chat', JSON.stringify(msgs));
        textInput.value = '';
        renderChatMessages();
    }

    function loadLiveBanner(elementId, htmlScript) {
        const zone = document.getElementById(elementId);
        if (!zone || !htmlScript) return;
        zone.innerHTML = '';
        const temp = document.createElement('div');
        temp.innerHTML = htmlScript;
        Array.from(temp.childNodes).forEach(node => {
            if (node.tagName === 'SCRIPT') {
                const sc = document.createElement('script');
                Array.from(node.attributes).forEach(attr => sc.setAttribute(attr.name, attr.value));
                sc.innerHTML = node.innerHTML;
                zone.appendChild(sc);
            } else {
                zone.appendChild(node.cloneNode(true));
            }
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
