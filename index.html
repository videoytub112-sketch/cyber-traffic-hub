<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS HASH — Институциональная экосистема облачного майнинга</title>
<style>
:root {
    --bg-main: #02040a;
    --bg-surface: rgba(13, 20, 38, 0.6);
    --bg-surface-glow: rgba(23, 37, 75, 0.8);
    --stroke: rgba(99, 102, 241, 0.2);
    --stroke-active: rgba(6, 182, 212, 0.6);
    --neon-blue: #00f0ff;
    --neon-indigo: #6366f1;
    --neon-green: #39ff14;
    --neon-amber: #ffaa00;
    --text-primary: #ffffff;
    --text-muted: #8ea1c4;
}

* { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
body {
    background: radial-gradient(circle at 50% -20%, #111b36 0%, #040712 50%, var(--bg-main) 100%);
    color: var(--text-primary);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
}

/* Premium Scrollbar */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg-main); }
::-webkit-scrollbar-thumb { background: var(--stroke); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--neon-blue); }

.container { max-width: 1400px; margin: 0 auto; padding: 0 30px; }

/* HEADER WITH GLASSMORPHISM */
header {
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(20px);
    background: rgba(2, 4, 10, 0.85);
    border-bottom: 1px solid var(--stroke);
    padding: 20px 0;
}
nav { display: flex; align-items: center; justify-content: space-between; }
.logo-area { display: flex; align-items: center; gap: 12px; }
.logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, var(--neon-blue), var(--neon-indigo)); border-radius: 8px; box-shadow: 0 0 15px var(--neon-blue); }
.logo-text { font-size: 1.4rem; font-weight: 900; letter-spacing: 2px; background: linear-gradient(90deg, #fff, var(--text-muted)); -webkit-background-clip: text; color: transparent; }
.nav-links { display: flex; gap: 35px; }
.nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: 0.3s; }
.nav-links a:hover, .nav-links a.active { color: var(--neon-blue); text-shadow: 0 0 10px rgba(0,240,255,0.5); }
.premium-bal {
    background: linear-gradient(135deg, rgba(6,182,212,0.1), rgba(99,102,241,0.05));
    border: 1px solid var(--stroke);
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 12px;
}
.premium-bal b { color: var(--neon-green); font-family: monospace; font-size: 1.1rem; }

/* HERO SECTION */
.hero-sec { padding: 120px 0 60px; text-align: center; position: relative; }
.hero-glow { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 800px; height: 400px; background: rgba(99,102,241,0.12); filter: blur(140px); pointer-events: none; }
.hero-sec h1 { font-size: clamp(2.5rem, 5.5vw, 4.2rem); font-weight: 900; line-height: 1.1; margin-bottom: 25px; letter-spacing: -1px; }
.hero-sec h1 span { background: linear-gradient(90deg, #fff, var(--neon-blue), var(--neon-indigo)); -webkit-background-clip: text; color: transparent; }
.hero-sec p { color: var(--text-muted); max-width: 850px; margin: 0 auto 40px; font-size: 1.2rem; line-height: 1.6; }

/* CORE BUTTONS */
.btn-cyber {
    padding: 16px 40px; border-radius: 4px; border: none; cursor: pointer; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; font-size: 0.85rem; transition: 0.4s; background: linear-gradient(135deg, var(--neon-indigo), var(--neon-blue)); color: #000; box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
}
.btn-cyber:hover { transform: translateY(-2px); box-shadow: 0 0 35px var(--neon-blue); }
.btn-outline {
    background: transparent; border: 1px solid var(--stroke); color: var(--text-primary); padding: 14px 35px; border-radius: 4px; text-transform: uppercase; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: 0.3s;
}
.btn-outline:hover { border-color: var(--neon-blue); color: var(--neon-blue); background: rgba(0, 240, 255, 0.02); }

/* CRYPTO MARKET TICKER */
.market-ticker-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 60px; }
.ticker-card { background: rgba(255,255,255,0.02); border: 1px solid var(--stroke); border-radius: 12px; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
.ticker-info h4 { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.ticker-info div { font-size: 1.4rem; font-weight: 800; margin-top: 4px; font-family: monospace; }
.ticker-trend { font-size: 0.85rem; font-weight: 700; padding: 4px 8px; border-radius: 6px; }
.ticker-trend.up { background: rgba(57,255,20,0.1); color: var(--neon-green); }

/* LIVE WORKSPACE GRID */
.dashboard-grid { display: grid; grid-template-columns: 1.3fr 0.7fr; gap: 30px; margin-top: 40px; }
.glass-card { background: var(--bg-surface); border: 1px solid var(--stroke); border-radius: 16px; padding: 35px; backdrop-filter: blur(16px); box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
.card-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }
.card-title::before { content: ''; display: inline-block; width: 4px; height: 18px; background: var(--neon-blue); border-radius: 2px; }

/* SLIDERS & PROGRESSION */
.slider-group { margin-bottom: 25px; }
.slider-header { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 10px; color: var(--text-muted); }
.slider-header b { color: var(--neon-blue); font-size: 1.1rem; }
.custom-range { -webkit-appearance: none; width: 100%; height: 5px; background: #0c1020; border-radius: 10px; outline: none; }
.custom-range::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; background: #fff; border: 4px solid var(--neon-indigo); border-radius: 50%; cursor: pointer; box-shadow: 0 0 15px var(--neon-indigo); }

.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 30px; }
.stat-item { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.02); padding: 20px; border-radius: 12px; text-align: center; }
.stat-item span { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); }
.stat-item div { font-size: 1.3rem; font-weight: 800; margin-top: 6px; font-family: monospace; }

/* TARIFFS */
.tariff-sec { padding: 100px 0 60px; }
.sec-head { text-align: center; margin-bottom: 50px; }
.sec-head h2 { font-size: 2.5rem; font-weight: 900; margin-bottom: 15px; }
.sec-head p { color: var(--text-muted); max-width: 700px; margin: 0 auto; font-size: 1.05rem; }
.tariff-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
.tariff-card { background: linear-gradient(180deg, rgba(15, 23, 42, 0.8) 0%, rgba(4, 7, 20, 0.9) 100%); border: 1px solid var(--stroke); border-radius: 20px; padding: 45px 35px; position: relative; display: flex; flex-direction: column; transition: 0.3s; }
.tariff-card:hover { transform: translateY(-5px); border-color: var(--stroke-active); box-shadow: 0 20px 40px rgba(0, 240, 255, 0.1); }
.tariff-badge { position: absolute; top: 25px; right: 25px; background: rgba(6, 182, 212, 0.15); border: 1px solid rgba(6, 182, 212, 0.3); color: var(--neon-blue); padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
.tariff-card h3 { font-size: 1.6rem; font-weight: 800; margin-bottom: 8px; }
.tariff-card .price-range { font-size: 1.05rem; color: var(--text-muted); margin-bottom: 25px; font-family: monospace; }
.tariff-card .yield-value { font-size: 2.8rem; font-weight: 900; color: #fff; line-height: 1; }
.tariff-card .yield-value span { font-size: 1rem; color: var(--neon-green); font-weight: 700; }
.tariff-features { list-style: none; display: flex; flex-direction: column; gap: 14px; margin: 30px 0; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 25px; }
.tariff-features li { display: flex; align-items: center; gap: 12px; font-size: 0.9rem; color: var(--text-muted); }
.tariff-features li::before { content: '✓'; color: var(--neon-blue); font-weight: bold; }

/* INFRASTRUCTURE BLOCK */
.infra-sec { padding: 60px 0; }
.infra-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; }
.map-placeholder { background: radial-gradient(circle, #16224f 0%, #070b1e 100%); border: 1px solid var(--stroke); border-radius: 20px; height: 400px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.map-dot { position: absolute; width: 14px; height: 14px; background: var(--neon-blue); border-radius: 50%; box-shadow: 0 0 20px var(--neon-blue); animation: pulse 2s infinite; }
@keyframes pulse { 0% { transform: scale(0.9); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }
.infra-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.metric-box { background: rgba(255,255,255,0.01); border: 1px solid rgba(255,255,255,0.03); padding: 25px; border-radius: 14px; }
.metric-box h5 { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
.metric-box p { font-size: 1.6rem; font-weight: 800; font-family: monospace; color: var(--neon-indigo); }

/* LIVE MONITORING CABINET БЛОК */
.active-pool-item { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
.pool-meta-flex { display: flex; justify-content: space-between; align-items: center; }
.pool-progress-bg { width: 100%; height: 4px; background: rgba(255,255,255,0.05); border-radius: 2px; margin: 15px 0; }
.pool-progress-fill { height: 100%; background: linear-gradient(90deg, var(--neon-indigo), var(--neon-blue)); width: 0%; box-shadow: 0 0 10px var(--neon-blue); }
