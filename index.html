<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Trading Demo</title>
    <style>
        :root {
            --bg-dark: #05060f;
            --panel-dark: #0f111d;
            --accent-cyan: #00f2fe;
            --accent-orange: #ffb167;
            --text-gray: #a1b0c4;
            --border-glow: rgba(0, 242, 254, 0.15);
            --red-candle: #ff3333;
            --green-candle: #00ff88;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Courier New', monospace;
            margin: 0;
            overflow: hidden;
            height: 100vh;
        }

        /* Верхняя панель */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            border-bottom: 1px solid var(--border-glow);
            background: rgba(15, 17, 29, 0.8);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 10;
        }

        .symbol-info h1 {
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            font-size: 24px;
        }
        .symbol-info p {
            color: var(--text-gray);
            font-size: 12px;
            margin: 2px 0 0;
        }

        .stats-bar span {
            margin-left: 20px;
            font-size: 14px;
        }
        .stats-bar .price { color: var(--accent-cyan); font-weight: bold; }
        .stats-bar .change.up { color: var(--green-candle); }
        .stats-bar .change.down { color: var(--red-candle); }

        /* Основной контейнер */
        .container {
            display: grid;
            grid-template-columns: 3fr 1fr; /* График 75%, Панель 25% */
            height: calc(100vh - 60px);
            position: relative;
        }

        /* График */
        .chart-area {
            position: relative;
            background-color: var(--bg-dark);
            border-right: 1px solid var(--border-glow);
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Правая панель */
        .sidebar {
            background: rgba(15, 17, 29, 0.9);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-left: 1px solid rgba(255,255,255,0.05);
        }

        .panel-title {
            color: var(--accent-cyan);
            text-transform: uppercase;
            font-size: 12px;
            border-bottom: 1px solid var(--border-glow);
            padding-bottom: 5px;
        }

        .order-form input, .order-form select {
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border-glow);
            color: white;
            padding: 10px;
            margin-bottom: 10px;
            width: 100%;
            box-sizing: border-box;
            font-family: inherit;
        }

        .btn-trade {
            width: 100%;
            padding: 15px;
            border: none;
            color: black;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-buy { background: var(--green-candle); }
        .btn-sell { background: var(--red-candle); }
        .btn-trade:hover { transform: scale(1.02); }

        /* Нижняя панель инструментов */
        .controls {
            position: absolute;
            bottom: 10px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 8px;
            z-index: 20;
        }
        
        .timeframes button {
            background: transparent;
            border: 1px solid var(--text-gray);
            color: var(--text-gray);
            padding: 5px 10px;
            cursor: pointer;
            margin-right: 5px;
        }
        .timeframes button.active {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        /* Декоративные элементы (матрица) */
        .matrix-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .symbol {
            position: absolute;
            color: rgba(0, 242, 254, 0.4);
            font-size: 14px;
            text-shadow: 0 0 5px rgba(0, 242, 254, 0.2);
        }
    </style>
</head>
<body>

    <header>
        <div class="symbol-info">
            <h1 id="symbol-name">BTC/USDT</h1>
            <p>Bitcoin / TetherUS</p>
        </div>
        <div class="stats-bar">
            <span>Last Price: <span id="last-price" class="price">45,000.00</span></span>
            <span>Change: <span id="change-val" class="change up">+2.5%</span></span>
            <span>Volume: <span id="volume-val">12.5B</span></span>
        </div>
    </header>

    <div class="container">
        <!-- Фон матрицы -->
        <div class="matrix-overlay" id="matrix-bg"></div>

        <!-- График -->
        <div class="chart-area">
            <canvas id="trading-chart"></canvas>
        </div>

        <!-- Панель управления -->
        <aside class="sidebar">
            <div>
                <div class="panel-title">Order Book</div>
                <div style="font-size: 10px; color: var(--text-gray); margin-bottom: 5px;">Top 3 Bids</div>
                <div style="font-size: 12px; margin-bottom: 10px;">44,990.00 (0.5 BTC)</div>
                <div style="font-size: 12px; margin-bottom: 10px;">44,985.00 (1.2 BTC)</div>
                <div style="font-size: 12px; margin-bottom: 10px;">44,980.00 (0.8 BTC)</div>
            </div>

            <div>
                <div class="panel-title">New Order</div>
                <div class="order-form">
                    <input type="text" value="0.001" placeholder="Amount">
                    <select>
                        <option>Market</option>
                        <option>Limit</option>
                    </select>
                    <button class="btn-trade btn-buy">BUY</button>
                    <button class="btn-trade btn-sell">SELL</button>
                </div>
            </div>

            <div style="margin-top: auto;">
                <div class="panel-title">Status</div>
                <div style="font-size: 10px; color: #00ff88;">Connection: OK</div>
                <div style="font-size: 10px; color: var(--text-gray);">Server: Matrix Node #7</div>
            </div>
        </aside>
    </div>

    <div class="controls">
        <div class="timeframes">
            <button onclick="setTimeframe('1m')" class="active">1M</button>
            <button onclick="setTimeframe('5m')">5M</button>
            <button onclick="setTimeframe('15m')">15M</button>
            <button onclick="setTimeframe('1H')">1H</button>
            <button onclick="setTimeframe('4H')">4H</button>
            <button onclick="setTimeframe('1D')">1D</button>
        </div>
        <div style="font-size: 12px; color: var(--text-gray);">
            Demo Mode - Data is simulated
        </div>
    </div>

    <script>
        // --- Логика генерации данных (упрощенная) ---
        const ctx = document.getElementById('trading-chart').getContext('2d');
        const width = ctx.canvas.width = window.innerWidth;
        const height = ctx.canvas.height = window.innerHeight - 60; // минус хедер
        
        let candles = [];
        let currentPrice = 45000;
        let volumeMultiplier = 1000;

        // Генерация начальных данных
        function generateData() {
            candles = [];
            let price = 45000;
            for (let i = 0; i < 50; i++) {
                const open = price;
                const change = (Math.random() - 0.5) * 200; // случайное движение
                const close = open + change;
                const high = Math.max(open, close) + Math.random() * 50;
                const low = Math.min(open, close) - Math.random() * 50;
                const volume = Math.random() * volumeMultiplier;
                
                candles.push({ open, high, low, close, volume });
                price = close;
            }
            currentPrice = close;
            updateUI();
            drawChart();
        }

        // --- Отрисовка графика ---
        function drawChart() {
            const barWidth = width / candles.length * 0.8;
            const padding = 40; // отступы
            
            ctx.clearRect(0, 0, width, height);
            
            // Рисуем сетку
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 1;
            const gridLines = 10;
            for(let i=0; i<=gridLines; i++) {
                const y = padding + (height - padding * 2) * (i / gridLines);
                ctx.beginPath();
                ctx.moveTo(padding, y);
                ctx.lineTo(width - padding, y);
                ctx.stroke();
            }

            // Рисуем свечи
            candles.forEach((c, index) => {
                const x = padding + index * (width / candles.length);
                const bodyHeight = Math.abs(c.close - c.open);
                const bodyY = c.close > c.open 
                    ? height - padding - c.close 
                    : height - padding - c.open;
                
                // Тень (wick)
                ctx.strokeStyle = c.close > c.open ? '#00ff88' : '#ff3333';
                ctx.beginPath();
                ctx.moveTo(x + barWidth/2, height - padding - c.high);
                ctx.lineTo(x + barWidth/2, height - padding - c.low);
                ctx.stroke();

                // Тело свечи
                ctx.fillStyle = c.close > c.open ? '#00ff88' : '#ff3333';
                ctx.fillRect(x, bodyY, barWidth, bodyHeight);
            });
        }

        // --- Обновление UI ---
        function updateUI() {
            document.getElementById('last-price').innerText = currentPrice.toLocaleString('en-US', {minimumFractionDigits: 2});
            const change = ((currentPrice - (currentPrice - 100)) / (currentPrice - 100)) * 100; // заглушка
            const changeEl = document.getElementById('change-val');
            changeEl.innerText = '+' + (Math.random() * 5).toFixed(2) + '%';
            changeEl.className = 'change up';
            document.getElementById('volume-val').innerText = (Math.random() * 20).toFixed(1) + 'B';
        }

        // --- Анимация матрицы на фоне ---
        function initMatrix() {
            const bg = document.getElementById('matrix-bg');
            const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const count = 100;
            
            for(let i=0; i<count; i++) {
                const span = document.createElement('span');
                span.className = 'symbol';
                span.innerText = chars[Math.floor(Math.random() * chars.length)];
                span.style.left = Math.random() * 100 + 'vw';
                span.style.top = Math.random() * 100 + 'vh';
                span.style.animation = `fall \${Math.random() * 5 + 5}s linear infinite`;
                bg.appendChild(span);
            }
            
            // Добавляем CSS анимацию динамически
            const style = document.createElement('style');
            style.innerHTML = `
                @keyframes fall {
                    from { transform: translateY(-10vh); opacity: 0; }
                    to { transform: translateY(110vh); opacity: 1; }
                }
            `;
            document.head.appendChild(style);
        }

        // --- Интерактив ---
        function setTimeframe(tf) {
            // Здесь можно добавить логику смены таймфрейма
            alert('Смена таймфрейма: ' + tf + ' (в демо режиме данные не меняются)');
        }

        // Запуск
        initMatrix();
        generateData();

        // Обновление цены каждые 2 секунды (имитация тиков)
        setInterval(() => {
            const change = (Math.random() - 0.5) * 50;
            currentPrice += change;
            // Добавляем новую свечу каждые N тиков (упрощено)
            if(Math.random() > 0.9) {
                const last = candles[candles.length - 1];
                const newCandle = {
                    open: last.close,
                    high: Math.max(last.close, last.close + change + 20),
                    low: Math.min(last.close, last.close + change - 20),
                    close: last.close + change,
                    volume: Math.random() * volumeMultiplier
                };
                candles.push(newCandle);
                if(candles.length > 50) candles.shift(); // удаляем старые
                drawChart();
                updateUI();
            }
        }, 2000);

        // Ресайз окна
        window.addEventListener('resize', () => {
            ctx.canvas.width = window.innerWidth;
            ctx.canvas.height = window.innerHeight - 60;
            drawChart();
        });
    </script>
</body>
</html>
