<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS HASH — Премиальная экосистема облачного майнинга</title>
<style>
:root {
    --bg-main: #02040a;
    --bg-surface: rgba(13, 20, 38, 0.6);
    --bg-surface-glow: rgba(23, 37, 75, 0.8);
    --stroke: rgba(99, 102, 241, 0.2);
    --stroke-active: rgba(6, 182, 212, 0.6);
    --neon-blue: #00f0ff;
    --neon-indigo: #6366f1;
    --neon-green: #39ff14;
    --neon-amber: #ffaa00;
    --text-primary: #ffffff;
    --text-muted: #8ea1c4;
}

* { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
body {
    background: radial-gradient(circle at 50% -20%, #111b36 0%, #040712 50%, var(--bg-main) 100%);
    color: var(--text-primary);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
}

/* Скроллбар уровня премиум */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg-main); }
::-webkit-scrollbar-thumb { background: var(--stroke); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--neon-blue); }

.container { max-width: 1400px; margin: 0 auto; padding: 0 30px; }

/* ХЕДЕР С ЭФФЕКТОМ СТЕКЛА */
header {
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(20px);
    background: rgba(2, 4, 10, 0.75);
    border-bottom: 1px solid var(--stroke);
    padding: 20px 0;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
}
nav { display: flex; align-items: center; justify-content: space-between; }
.logo-area { display: flex; align-items: center; gap: 12px; }
.logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, var(--neon-blue), var(--neon-indigo)); border-radius: 8px; box-shadow: 0 0 15px var(--neon-blue); }
.logo-text { font-size: 1.4rem; font-weight: 900; letter-spacing: 2px; background: linear-gradient(90deg, #fff, var(--text-muted)); -webkit-background-clip: text; color: transparent; }
.nav-links { display: flex; gap: 35px; }
.nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: 0.3s; position: relative; }
.nav-links a:hover, .nav-links a.active { color: var(--neon-blue); text-shadow: 0 0 10px rgba(0,240,255,0.5); }
.header-actions { display: flex; align-items: center; gap: 20px; }

/* ВИДЖЕТ БАЛАНСА */
.premium-bal {
    background: linear-gradient(135deg, rgba(6,182,212,0.1), rgba(99,102,241,0.05));
    border: 1px solid var(--stroke);
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: inset 0 0 15px rgba(99,102,241,0.05);
}
.premium-bal span { color: var(--text-muted); font-size: 0.8rem; }
.premium-bal b { color: var(--neon-green); font-family: monospace; font-size: 1.1rem; text-shadow: 0 0 10px rgba(57,255,20,0.3); }

/* ДОРОГИЕ КНОПКИ */
.btn-cyber {
    position: relative;
    padding: 14px 35px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: 0.85rem;
    transition: 0.4s;
    overflow: hidden;
    background: linear-gradient(135deg, var(--neon-indigo), var(--neon-blue));
    color: #000;
    box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
}
.btn-cyber:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 35px var(--neon-blue);
}
.btn-outline {
    background: transparent;
    border: 1px solid var(--stroke);
    color: var(--text-primary);
    padding: 12px 30px;
    border-radius: 4px;
    text-transform: uppercase;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}
.btn-outline:hover {
    border-color: var(--neon-blue);
    background: rgba(0, 240, 255, 0.03);
    color: var(--neon-blue);
    box-shadow: 0 0 15px rgba(0,240,255,0.1);
}

/* ГЕРОЙ-БЛОК */
.hero-sec { padding: 100px 0 60px; text-align: center; position: relative; }
.hero-glow { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 600px; height: 300px; background: rgba(99,102,241,0.15); filter: blur(120px); border-radius: 50%; pointer-events: none; }
.hero-sec h1 { font-size: clamp(2.5rem, 5vw, 4.5rem); font-weight: 900; line-height: 1.05; letter-spacing: -1px; margin-bottom: 25px; }
.hero-sec h1 span { background: linear-gradient(90deg, #fff, #fff, var(--neon-blue), var(--neon-indigo)); -webkit-background-clip: text; color: transparent; background-size: 200%; animation: shine 5s linear infinite; }
@keyframes shine { to { background-position: 200% center; } }
.hero-sec p { color: var(--text-muted); max-width: 800px; margin: 0 auto 40px; font-size: 1.2rem; line-height: 1.6; }

/* МАСШТАБНЫЙ ИНТЕРФЕЙС / ДАШБОРД */
.dashboard-grid { display: grid; grid-template-columns: 1.3fr 0.7fr; gap: 30px; margin-top: 50px; }
.glass-card {
    background: var(--bg-surface);
    border: 1px solid var(--stroke);
    border-radius: 16px;
    padding: 35px;
    backdrop-filter: blur(16px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    position: relative;
    transition: 0.3s;
}
.glass-card:hover { border-color: rgba(99, 102, 241, 0.4); }
.card-title { font-size: 1.25rem; font-weight: 800; letter-spacing: 0.5px; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }
.card-title::before { content: ''; display: inline-block; width: 4px; height: 16px; background: var(--neon-blue); border-radius: 2px; }

/* КАЛЬКУЛЯТОР BUGATTI LEVEL */
.premium-slider-group { margin-bottom: 30px; }
.slider-header { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 12px; color: var(--text-muted); }
.slider-header b { color: var(--neon-blue); font-size: 1.1rem; }
.custom-range { -webkit-appearance: none; width: 100%; height: 5px; background: #0c1020; border-radius: 10px; outline: none; }
.custom-range::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; background: #fff; border: 4px solid var(--neon-indigo); border-radius: 50%; cursor: pointer; box-shadow: 0 0 15px var(--neon-indigo); transition: 0.2s; }
.custom-range::-webkit-slider-thumb:hover { transform: scale(1.1); box-shadow: 0 0 20px var(--neon-blue); border-color: var(--neon-blue); }

.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 35px; }
.stat-item { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.03); padding: 20px; border-radius: 12px; text-align: center; }
.stat-item span { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
.stat-item div { font-size: 1.4rem; font-weight: 800; margin-top: 6px; font-family: monospace; }

/* КАРТОЧКИ ТАРИФОВ (ИНВЕСТИЦИОННЫЕ ПАКЕТЫ) */
.tariff-sec { padding: 80px 0; }
.tariff-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
.tariff-card {
    background: linear-gradient(180deg, rgba(15, 23, 42, 0.8) 0%, rgba(4, 7, 20, 0.9) 100%);
    border: 1px solid var(--stroke);
    border-radius: 20px;
    padding: 45px 35px;
    position: relative;
    transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    flex-direction: column;
}
.tariff-card::before { content: ''; position: absolute; inset: 0; border-radius: 20px; padding: 1px; background: linear-gradient(180deg, rgba(255,255,255,0.1), transparent); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
.tariff-card:hover { transform: translateY(-8px); border-color: var(--stroke-active); box-shadow: 0 30px 60px rgba(0, 240, 255, 0.15); }
.tariff-card.vip-card { border-color: rgba(99, 102, 241, 0.4); background: linear-gradient(180deg, rgba(20, 18, 54, 0.8) 0%, rgba(4, 7, 20, 0.9) 100%); }
.tariff-card.vip-card:hover { border-color: var(--neon-indigo); box-shadow: 0 30px 60px rgba(99, 102, 241, 0.25); }

.tariff-badge { position: absolute; top: 25px; right: 25px; background: rgba(6, 182, 212, 0.15); border: 1px solid rgba(6, 182, 212, 0.3); color: var(--neon-blue); padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
.vip-card .tariff-badge { background: rgba(139, 92, 246, 0.2); border: 1px solid rgba(139, 92, 246, 0.4); color: #c084fc; }

.tariff-card h3 { font-size: 1.6rem; font-weight: 800; margin-bottom: 8px; }
.tariff-card .price-range { font-size: 1.1rem; color: var(--text-muted); margin-bottom: 25px; font-family: monospace; }
.tariff-card .yield-value { font-size: 2.8rem; font-weight: 900; color: #fff; line-height: 1; display: flex; align-items: baseline; gap: 5px; }
.tariff-card .yield-value span { font-size: 1rem; color: var(--neon-green); font-weight: 700; }
.tariff-card .yield-sub { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 30px; }

.tariff-features { list-style: none; display: flex; flex-direction: column; gap: 14px; margin-bottom: 40px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 25px; }
.tariff-features li { display: flex; align-items: center; gap: 12px; font-size: 0.9rem; color: var(--text-muted); }
.tariff-features li::before { content: ''; display: inline-block; width: 6px; height: 6px; background: var(--neon-blue); border-radius: 50%; box-shadow: 0 0 8px var(--neon-blue); }

/* ЖИВЫЕ КАРТОЧКИ УПРАВЛЕНИЯ МОЩНОСТЯМИ */
.active-pool-item {
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
}
.pool-meta-flex { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
.pool-title-tech { font-weight: 800; font-size: 1.1rem; letter-spacing: 0.5px; }
